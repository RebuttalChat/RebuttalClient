name: Build AppImage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'
          cache: 'yarn'

      - name: Install Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsecret-1-dev

      - name: Setup Yarn
        run: yarn install --frozen-lockfile

      - name: Compile
        run: |
          yarn run build
          yarn run build-webapp

      - name: Package
        run: yarn run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RebuttalClient-Linux-AppImage
          path: dist/*.AppImage

